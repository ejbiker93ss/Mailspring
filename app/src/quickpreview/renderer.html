  <div id="the-doc"><canvas id="the-canvas"></canvas></div>

  <script>
    const div = document.getElementById('the-doc');

    function finishWithWindowCapture(previewToken, startedAt = Date.now()) {
      // Remove scroll bars or they appear in the capture on Windows
      document.body.style.overflow = 'hidden';

      // Wait up to 1 sec for images in the rendered HTML to finish loading
      const waitingForImage = Array.from(document.querySelectorAll('img')).find(
        (i) => i.complete === false
      );
      if (waitingForImage && Date.now() - startedAt < 1000) {
        setTimeout(() => finishWithWindowCapture(previewToken, startedAt), 50);
        return;
      }

      window.requestAnimationFrame(() => {
        window.requestAnimationFrame(() => {
          window.requestAnimationFrame(async () => {
            await window.electronAPI.finishCapture(previewToken);
            document.title = 'Finished';
          });
        });
      });
    }

    function createMediaViewer(title) {
      document.documentElement.classList.add('media-preview');
      document.body.classList.add('media-preview');
      div.innerHTML = `
        <div class="media-viewer">
          <div class="media-drag-region"></div>
          <div class="media-title"></div>
          <div class="media-toolbar">
            <button type="button" data-action="rotate-left" title="Rotate counterclockwise">↶</button>
            <button type="button" data-action="rotate-right" title="Rotate clockwise">↷</button>
            <button type="button" data-action="zoom-out" title="Zoom out">−</button>
            <span class="media-zoom-label">100%</span>
            <button type="button" data-action="zoom-in" title="Zoom in">+</button>
            <button type="button" data-action="reset" title="Reset view">Fit</button>
            <button type="button" class="media-close" data-action="close" title="Close">×</button>
          </div>
          <div class="media-viewport"><div class="media-stage"></div></div>
        </div>`;

      const viewport = div.querySelector('.media-viewport');
      const stage = div.querySelector('.media-stage');
      const zoomLabel = div.querySelector('.media-zoom-label');
      div.querySelector('.media-title').textContent = title || '';
      const listeners = [];
      let rotation = 0;
      let zoom = 1;

      const notify = () => {
        zoomLabel.textContent = `${Math.round(zoom * 100)}%`;
        listeners.forEach((listener) => listener({ rotation, zoom }));
      };
      const setZoom = (nextZoom) => {
        zoom = Math.max(0.25, Math.min(4, nextZoom));
        notify();
      };
      const rotate = (amount) => {
        rotation = (rotation + amount + 360) % 360;
        notify();
      };
      const reset = () => {
        rotation = 0;
        zoom = 1;
        viewport.scrollTo({ top: 0, left: 0 });
        notify();
      };

      div.querySelector('[data-action="rotate-left"]').onclick = () => rotate(-90);
      div.querySelector('[data-action="rotate-right"]').onclick = () => rotate(90);
      div.querySelector('[data-action="zoom-out"]').onclick = () => setZoom(zoom / 1.2);
      div.querySelector('[data-action="zoom-in"]').onclick = () => setZoom(zoom * 1.2);
      div.querySelector('[data-action="reset"]').onclick = reset;
      div.querySelector('[data-action="close"]').onclick = () => window.close();
      viewport.addEventListener(
        'wheel',
        (event) => {
          if (!event.ctrlKey) {
            return;
          }
          event.preventDefault();
          setZoom(zoom * (event.deltaY < 0 ? 1.12 : 1 / 1.12));
        },
        { passive: false }
      );

      return {
        viewport,
        stage,
        getState: () => ({ rotation, zoom }),
        onChange: (listener) => listeners.push(listener),
        notify,
      };
    }

    async function runImage() {
      const viewer = createMediaViewer(filePath.split(/[\\/]/).pop());
      viewer.stage.classList.add('is-image');
      const extension = filePath.split('.').pop().toLowerCase();
      const mimeTypes = {
        avif: 'image/avif',
        bmp: 'image/bmp',
        gif: 'image/gif',
        ico: 'image/x-icon',
        jpeg: 'image/jpeg',
        jpg: 'image/jpeg',
        png: 'image/png',
        svg: 'image/svg+xml',
        webp: 'image/webp',
      };
      const buffer = await window.electronAPI.previewFileAsBuffer();
      const objectURL = URL.createObjectURL(new Blob([buffer], { type: mimeTypes[extension] }));
      const image = document.createElement('img');
      viewer.stage.appendChild(image);

      image.onload = () => {
        const availableWidth = Math.max(320, viewer.viewport.clientWidth - 56);
        const availableHeight = Math.max(240, viewer.viewport.clientHeight - 98);
        const fitScale = Math.min(
          1,
          availableWidth / image.naturalWidth,
          availableHeight / image.naturalHeight
        );
        const baseWidth = image.naturalWidth * fitScale;
        const baseHeight = image.naturalHeight * fitScale;

        const update = ({ rotation, zoom }) => {
          const sideways = rotation % 180 !== 0;
          const width = baseWidth * zoom;
          const height = baseHeight * zoom;
          viewer.stage.style.width = `${sideways ? height : width}px`;
          viewer.stage.style.height = `${sideways ? width : height}px`;
          image.style.width = `${width}px`;
          image.style.height = `${height}px`;
          image.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;
        };
        viewer.onChange(update);
        update(viewer.getState());
      };
      image.src = objectURL;
      window.addEventListener('unload', () => URL.revokeObjectURL(objectURL), { once: true });
    }

    async function showPdfInMediaViewer(pdf) {
      const viewer = createMediaViewer(filePath.split(/[\\/]/).pop());
      viewer.stage.classList.add('is-pdf');
      let renderGeneration = 0;

      const renderPages = async ({ rotation, zoom }) => {
        const generation = ++renderGeneration;
        viewer.stage.innerHTML = '';
        const availableWidth = Math.max(320, viewer.viewport.clientWidth - 64);

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
          const page = await pdf.getPage(pageNumber);
          if (generation !== renderGeneration) return;
          const initialViewport = page.getViewport({ scale: 1, rotation });
          const cssScale = Math.min(2, availableWidth / initialViewport.width);
          const outputScale = window.devicePixelRatio || 1;
          const viewport = page.getViewport({ scale: cssScale * outputScale, rotation });
          const canvas = document.createElement('canvas');
          const baseWidth = viewport.width / outputScale;
          const baseHeight = viewport.height / outputScale;
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          canvas.dataset.baseWidth = String(baseWidth);
          canvas.dataset.baseHeight = String(baseHeight);
          const currentZoom = viewer.getState().zoom;
          canvas.style.width = `${baseWidth * currentZoom}px`;
          canvas.style.height = `${baseHeight * currentZoom}px`;
          viewer.stage.appendChild(canvas);
          await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        }
      };

      let previousRotation = 0;
      viewer.onChange((state) => {
        if (state.rotation !== previousRotation) {
          previousRotation = state.rotation;
          renderPages(state);
          return;
        }
        viewer.stage.querySelectorAll('canvas').forEach((canvas) => {
          canvas.style.width = `${Number(canvas.dataset.baseWidth) * state.zoom}px`;
          canvas.style.height = `${Number(canvas.dataset.baseHeight) * state.zoom}px`;
        });
      });
      await renderPages(viewer.getState());
    }

    async function runPDF({ previewToken, mode }) {
      const el = document.createElement('script');
      el.onload = async () => {
        pdfjsLib.GlobalWorkerOptions.workerSrc = './pdfjs-4.3.136/build/pdf.worker.mjs';

        const buffer = await window.electronAPI.previewFileAsBuffer();
        const pdf = await pdfjsLib.getDocument(buffer, {
          cMapUrl: './pdfjs-4.3.136/web/cmaps',
          cMapPacked: true,
        }).promise;

        if (mode === 'display') {
          await showPdfInMediaViewer(pdf);
          return;
        }

        div.innerHTML = '';
        document.body.style.margin = '0';
        document.body.style.background = '#252525';

        const pageCount = 1;
        for (let pageNumber = 1; pageNumber <= pageCount; pageNumber += 1) {
          const page = await pdf.getPage(pageNumber);
          const viewport = page.getViewport({ scale: 1 });
          const availableWidth = mode === 'capture' ? window.outerWidth : window.innerWidth - 32;
          const scale = Math.min(2, availableWidth / viewport.width);
          const scaledViewport = page.getViewport({ scale });
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.width = scaledViewport.width;
          canvas.height = scaledViewport.height;
          canvas.style.display = 'block';
          canvas.style.maxWidth = 'calc(100% - 32px)';
          canvas.style.height = 'auto';
          canvas.style.margin = '16px auto';
          canvas.style.boxShadow = '0 2px 14px rgba(0,0,0,.45)';
          div.appendChild(canvas);
          await page.render({ canvasContext: context, viewport: scaledViewport }).promise;
        }

        if (mode === 'capture') {
          const canvas = div.querySelector('canvas');
          canvas.toBlob((blob) => {
            const reader = new FileReader();
            reader.addEventListener('loadend', async () => {
              await window.electronAPI.finishWithData(previewToken, new Uint8Array(reader.result));
              document.title = 'Finished';
            });
            reader.readAsArrayBuffer(blob);
          });
        }
      };

      el.type = 'module';
      el.src = `pdfjs-4.3.136/build/pdf.mjs`;
      document.body.appendChild(el);
    }

    async function runXLSX({ previewToken }) {
      const data = await window.electronAPI.previewFileAsBuffer();
      const xlsx = document.createElement('script');
      xlsx.onload = () => {
        const workbook = window.XLSX.read(data, {
          type: 'array',
          cellStyles: true,
          cellHTML: true,
        });

        div.innerHTML = '';

        if (mode === 'capture') {
          div.innerHTML = sanitizeHTML(
            window.XLSX.write(workbook, {
              sheet: workbook.SheetNames[0],
              type: 'string',
              bookType: 'html',
              header: '<div>',
              footer: '</div>',
            })
          );
          finishWithWindowCapture(previewToken);
        } else {
          const content = document.createElement('div');
          content.classList.add('xlsx-content');
          div.appendChild(content);
          const tabs = document.createElement('div');
          tabs.classList.add('xlsx-tabs');
          div.appendChild(tabs);

          const showTab = (sheetName) => {
            document.querySelectorAll('.tab').forEach((tab) => tab.classList.remove('active'));
            const tab = document.querySelector(`[data-sheet-name="${sheetName}"]`);
            if (tab) tab.classList.add('active');

            content.innerHTML = sanitizeHTML(
              window.XLSX.write(workbook, {
                sheet: sheetName,
                type: 'string',
                bookType: 'html',
                header: '<div>',
                footer: '</div>',
              })
            );
          };

          workbook.SheetNames.forEach((sheetName) => {
            const tab = document.createElement('div');
            tab.classList.add('tab');
            tab.innerText = sheetName;
            tab.dataset.sheetName = sheetName;
            tab.addEventListener('click', () => showTab(sheetName));
            tabs.appendChild(tab);
          });

          showTab(workbook.SheetNames[0]);
        }
      };
      xlsx.src = './xlsx-0.18.5/xlsx.full.min.js';
      document.body.appendChild(xlsx);
    }

    async function runPrism({ filePath, previewToken, mode }) {
      const ext = filePath.split('.').pop();
      const str = await window.electronAPI.previewFileAsString({
        truncate: mode === 'capture',
      });

      const grammars = {
        html: 'html',
        xml: 'xml',
        svg: 'svg',
        css: 'css',
        js: 'javascript',
        c: 'c',
        h: 'c',
        cs: 'csharp',
        cc: 'cpp',
        cpp: 'cpp',
        patch: 'diff',
        go: 'go',
        java: 'java',
        json: 'json',
        jsonp: 'json',
        tex: 'latex',
        m: 'objectivec',
        mm: 'objectivec',
        py: 'python',
        jsx: 'jsx',
        tsx: 'tsx',
        rb: 'ruby',
        rs: 'rust',
        sql: 'sql',
        swift: 'swift',
        ts: 'typescript',
        yaml: 'yaml',
        txt: 'clike',
        log: 'clike',
      };

      const grammar = grammars[ext] || 'clike';

      // Attach Prism CSS
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = './prism-1.15.0/prism.css';
      document.body.appendChild(link);
      document.body.style.margin = '0';

      // Attach <pre><code class="language-XXX">{text}</code></pre> to the DOM
      div.innerHTML = '';
      if (mode !== 'capture') {
        div.style.opacity = 0;
      }
      const preEl = document.createElement('pre');
      preEl.style = 'min-height: 100%; margin: 0; border-radius: 0;';
      div.appendChild(preEl);

      const codeEl = document.createElement('code');
      codeEl.textContent = str;
      codeEl.classList.add(`language-${grammar}`);
      preEl.appendChild(codeEl);

      // Load the Prism script and capture/show the DOM when it's completed
      const finish = () => {
        const stylesReady = window.getComputedStyle(preEl).fontFamily.includes('Monaco');
        if (!stylesReady) {
          setTimeout(finish, 1);
          return;
        }

        div.style.opacity = 1;
        if (mode === 'capture') {
          finishWithWindowCapture(previewToken);
        }
      };

      const script = document.createElement('script');
      script.onload = finish;
      script.src = './prism-1.15.0/prism.js';
      document.body.appendChild(script);
    }

    async function runMammoth({ previewToken, mode }) {
      const rawHTML = await window.electronAPI.previewFileAsMammothHTML();
      div.innerHTML = sanitizeHTML(rawHTML);
      if (mode === 'capture') {
        finishWithWindowCapture(previewToken);
      }
    }

    async function runSnarkdown({ previewToken, mode }) {
      const rawHTML = await window.electronAPI.previewFileAsSnarkdownHTML();
      div.innerHTML = sanitizeHTML(rawHTML);
      div.style.fontFamily =
        '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol"';
      if (mode === 'capture') {
        finishWithWindowCapture(previewToken);
      }
    }

    const { mode, filePath, previewToken, strategy } = JSON.parse(
      decodeURIComponent(window.location.search.substr(1))
    );

    window.requestAnimationFrame(() => {
      if (strategy === 'pdfjs') {
        runPDF({ previewToken, mode });
      } else if (strategy === 'image') {
        runImage();
      } else if (strategy === 'mammoth') {
        runMammoth({ mode, previewToken });
      } else if (strategy === 'snarkdown') {
        runSnarkdown({ mode, previewToken });
      } else if (strategy === 'prism') {
        runPrism({ filePath, mode, previewToken });
      } else if (strategy === 'xlsx') {
        runXLSX({ mode, previewToken });
      }
    });
  </script>
